name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Verify files exist
      run: |
        ls -lah *.html
        echo "✅ All HTML files verified"
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
        cname: false
        force_orphan: true
        commit_message: 'Deploy: Updated website from GitHub Actions'

    - name: Verify deployment
      run: |
        echo "✅ Deployment complete!"
        echo "Website: https://cogaston0.github.io/vp-beauty-website/"
